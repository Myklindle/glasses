name: Refresh episodes and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Look up the newest full episodes
        id: update
        run: python3 scripts/update_latest.py

      - name: Commit the new episode list
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest episodes"
          git push

      # Scheduled runs with nothing new skip the deploy.
      - name: Stage site files
        id: stage
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        run: |
          mkdir _site
          cp -R index.html styles.css app.js latest.json icons .well-known .nojekyll _site/

      - uses: actions/configure-pages@v6
        if: steps.stage.outcome == 'success'

      - uses: actions/upload-pages-artifact@v5
        if: steps.stage.outcome == 'success'
        with:
          path: _site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
        if: steps.stage.outcome == 'success'
